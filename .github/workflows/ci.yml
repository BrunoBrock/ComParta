name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install the MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 Check

      # When the committed THIRD-PARTY-NOTICES.txt is out of date, the right one from this Windows build.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: third-party-notices
          path: publish/THIRD-PARTY-NOTICES.txt
          if-no-files-found: ignore

      # The same file in the log, for whoever can read the log but not download the artifact.
      - name: Fresh third-party notices (base64)
        if: failure()
        shell: pwsh
        run: |
          $fresh = 'publish/THIRD-PARTY-NOTICES.txt'
          if (Test-Path $fresh) {
            Write-Host '-----BEGIN NOTICES-----'
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($fresh), 'InsertLineBreaks')
            Write-Host '-----END NOTICES-----'
          }

  # The MSIX package (epic 5 story 2), signed with a test certificate, installed and started on the runner.
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install the MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Make the package
        id: package
        shell: pwsh
        # A tag like v1.2.3 names the version; anything else is 0.1.<run number>.
        run: |
          $version = if ('${{ github.ref }}' -match '^refs/tags/v(\d+\.\d+\.\d+)') { $Matches[1] } else { '0.1.${{ github.run_number }}' }
          "version=$version" >> $env:GITHUB_OUTPUT
          ./build.ps1 Package -SkipTests -Version $version

      - name: Install, check and start it
        shell: pwsh
        run: ./.github/scripts/check-package.ps1 publish/package -Version ${{ steps.package.outputs.version }}

      # The zip for people without the Store (epic 5 stories 4 and 6): unpacked, started with no .NET
      # to lean on, and used through its own screen (share a file from the file dialog, then quit).
      - name: Make the zip
        shell: pwsh
        run: ./build.ps1 Zip -SkipTests -Version ${{ steps.package.outputs.version }}

      - name: Unpack, start and use the zip
        shell: pwsh
        run: ./.github/scripts/check-zip.ps1 publish/ComParta-${{ steps.package.outputs.version }}-win-x64.zip -Version ${{ steps.package.outputs.version }}

      - name: Test the release notes
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v

      - uses: actions/upload-artifact@v7
        with:
          name: ComParta-msix
          path: |
            publish/package/*.msix
            publish/package/*.cer

      - uses: actions/upload-artifact@v7
        with:
          name: ComParta-zip
          path: publish/ComParta-*-win-x64.zip


  # The Android app (epic 7): built on Linux, kept as a download, then installed and started on an
  # emulator, where the engine must start and the screen must be answered through the bridge.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build the screen
        working-directory: src/ui
        run: |
          npm ci
          npm run build

      - name: Install the Android parts the build needs
        run: >
          dotnet build src/ComParta.App/ComParta.App.csproj -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Build the APK
        run: >
          dotnet publish src/ComParta.App/ComParta.App.csproj -f net10.0-android -c Release
          -p:AndroidSdkDirectory="$ANDROID_HOME" -o publish/android

      - uses: actions/upload-artifact@v7
        with:
          name: ComParta-apk
          path: publish/android/*-Signed.apk

      - name: Let the emulator use the processor directly
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start it on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/check-android.sh publish/android

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: android-check
          path: |
            publish/android/android-first-screen.png
            publish/android/android-log.txt
          if-no-files-found: ignore
