name: Security

# Code scanning, vulnerable dependencies and leaked secrets, on every pull request and for main.
# Runs weekly too, because new advisories appear for code that has not changed.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # No build needed, so the Windows-only app project is scanned on Linux too.
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails when a pull request adds a package with a known high or critical vulnerability.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  vulnerable-packages:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: NuGet packages
        shell: pwsh
        run: |
          # Every project except the app shell, which needs the Windows MAUI workload to restore.
          $found = $false
          foreach ($project in Get-ChildItem src, tests, tools -Filter *.csproj -Recurse | Where-Object Name -ne 'ComParta.App.csproj') {
            dotnet restore $project.FullName --nologo -v quiet
            $report = dotnet list $project.FullName package --vulnerable --include-transitive 2>&1 | Out-String
            Write-Host $report
            if ($report -match 'has the following vulnerable packages') { $found = $true }
          }
          if ($found) { throw 'A NuGet package has a known vulnerability; see the list above.' }

      - name: npm packages
        working-directory: src/ui
        run: npm audit --audit-level=high

  # Sends the NuGet packages, the ones they bring in too, to the dependency graph, so Dependabot
  # alerts cover them. Replaces GitHub's automatic submission, which restores the whole solution
  # on Linux and always fails on the app shell ("submit-nuget"). Turn that one off in Settings →
  # Advanced Security → Dependency graph → Automatic dependency submission.
  dependency-submission:
    name: Dependency submission
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          # Every project except the app shell, which needs the Windows MAUI workload to restore.
          foreach ($project in Get-ChildItem src, tests, tools -Filter *.csproj -Recurse | Where-Object Name -ne 'ComParta.App.csproj') {
            dotnet restore $project.FullName --nologo -v quiet
            if ($LASTEXITCODE -ne 0) { throw "$($project.Name) did not restore." }
          }

      - uses: actions/component-detection-dependency-submission-action@98beaea5a1227f3db476e4c9ca959a0cacd7ac4f
        with:
          detectorsCategories: NuGet

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
