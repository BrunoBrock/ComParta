name: PR checks

# Lint, type checks and tests with code coverage for every pull request and for main.
# Fails when coverage drops below the thresholds below (C#) or in src/ui/vite.config.ts (UI).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Raise these as tests are added.
  MIN_LINE_COVERAGE: 75
  MIN_BRANCH_COVERAGE: 65

jobs:
  coverage:
    name: Coverage
    # Windows, because some tests use Windows paths and the app is Windows-first.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install UI packages
        working-directory: src/ui
        run: npm ci

      - name: Lint the UI
        working-directory: src/ui
        run: npm run lint

      - name: Type-check the UI
        working-directory: src/ui
        run: npx tsc -b

      - name: UI tests with coverage
        working-directory: src/ui
        run: npm run test:coverage

      - name: C# tests with coverage
        shell: pwsh
        run: |
          # Test projects only: they need no MAUI workload.
          foreach ($project in Get-ChildItem tests -Filter *.csproj -Recurse) {
            dotnet test $project.FullName --collect:"XPlat Code Coverage" --results-directory TestResults/coverage --nologo -v minimal
            if ($LASTEXITCODE -ne 0) { throw "$($project.Name) failed." }
          }

      - name: Coverage report
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator "-reports:TestResults/coverage/**/coverage.cobertura.xml" -targetdir:TestResults/report "-reporttypes:MarkdownSummaryGithub;JsonSummary;Html"
          if ($LASTEXITCODE -ne 0) { throw 'Coverage report failed.' }

          "## C# coverage" >> $env:GITHUB_STEP_SUMMARY
          Get-Content TestResults/report/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

          $ui = (Get-Content src/ui/coverage/coverage-summary.json | ConvertFrom-Json).total
          @(
            '## UI coverage'
            ''
            '| Statements | Branches | Functions | Lines |'
            '| --- | --- | --- | --- |'
            "| $($ui.statements.pct)% | $($ui.branches.pct)% | $($ui.functions.pct)% | $($ui.lines.pct)% |"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

          $cs = (Get-Content TestResults/report/Summary.json | ConvertFrom-Json).summary
          if ($cs.linecoverage -lt [double]$env:MIN_LINE_COVERAGE) {
            throw "C# line coverage $($cs.linecoverage)% is below $env:MIN_LINE_COVERAGE%."
          }
          if ($cs.branchcoverage -lt [double]$env:MIN_BRANCH_COVERAGE) {
            throw "C# branch coverage $($cs.branchcoverage)% is below $env:MIN_BRANCH_COVERAGE%."
          }

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            TestResults/report
            src/ui/coverage
          if-no-files-found: ignore
