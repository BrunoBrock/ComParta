[[entry]]
id = 8
type = "story"
title = "Field test: a family folder"
description = "One relative shares a folder of photos with two others, one on a PC in another home and one on a phone on mobile data; adds files the next day. Records what confused them."
verify = "Results recorded in this folder: both got the folder, the added files arrived, and the words were understood."
