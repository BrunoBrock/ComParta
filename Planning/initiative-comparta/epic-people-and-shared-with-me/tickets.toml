# Stories of epic-people-and-shared-with-me, in build order.
# Stories after 1 are refined once the spike's design is accepted.
# Re-scoped 2026-10-20 (roadmap P-19): friends, their shared files, and only friends by default.

[[entry]]
id = 1
type = "story"
title = "Spike: friends and private sharing"
description = "Designs device keys, adding a friend (from an invite and without one), the known-sources rule, private delivery and blinded lookup within AD-2, AD-9 and AD-24, for phones and PCs. Tests the riskiest part (refusing a stranger before any byte is written, and blinded announce with MonoTorrent) in a throwaway branch, sketches the Friends, Shared with me and friend request screens in the UX design, and proposes the architecture changes."
verify = "A design note in this folder, a working prototype of the riskiest part, and a draft architecture update the maintainer accepts or rejects."
covers = ["CAP-24", "CAP-31"]
after = []
hitl = true                 # The maintainer accepts the design
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Device identity and adding a friend"
description = "A key pair per device, kept on the device. An invite from someone new asks 'Add {name} as a friend?' before the file; 'Add a friend' also makes a link or code without a file. Both devices remember each other."
verify = "Set when refined."
covers = ["CAP-24"]
after = [1, "2.4"]
hitl = false
risk = "high"
refine = true

