# The epics of initiative-comparta, in build order.

[[epic]]
id = 1
slug = "epic-share-a-file"
title = "A person adds and removes shared files on Windows (MVP)"
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-4", "CAP-5"]

[[epic]]
id = 2
slug = "epic-send-to-a-person"
title = "A person sends a share to someone they choose, who receives it"
covers = ["CAP-6", "CAP-7"]
after = [{ epic = 1, needs = "the running app with shares, the bridge contract and the engine port" }]

[[epic]]
id = 3
slug = "epic-safe-received-content"
title = "Received files cannot harm the computer"
covers = ["CAP-9"]
after = [{ epic = 2, needs = "the receive path that writes into the Received root" }]

[[epic]]
id = 4
slug = "epic-follow-a-transfer"
title = "A person sees how a transfer is going"
covers = ["CAP-8"]
after = [{ epic = 2, needs = "transfers between two devices" }]

[[epic]]
id = 5
slug = "epic-install-and-update"
title = "A non-technical person installs and updates the app"
covers = ["CAP-11"]
after = [{ epic = 1, needs = "the Windows app to package" }]

[[epic]]
id = 6
slug = "epic-brazilian-portuguese"
title = "The app speaks Brazilian Portuguese"
covers = ["CAP-12"]
after = [{ epic = 1, needs = "the translation catalog and the check that every string goes through it" }]

[[epic]]
id = 7
slug = "epic-android"
title = "A person uses ComParta on an Android phone"
covers = ["CAP-10"]
after = [{ epic = 1, needs = "the core, contracts and UI the Android shell hosts" }, { epic = 2, needs = "invite and receive flows to carry over" }]
